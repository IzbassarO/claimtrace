<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>ClaimTrace architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="1360" height="700" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">ClaimTrace — how a manuscript is audited</text>
<rect x="1060" y="24" width="18" height="18" rx="4" fill="#e7f0ff" stroke="#0b5cd5" stroke-width="2"/>
<text x="1086" y="38" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">check stage (decides a status / verdict)</text>
<rect x="30" y="62" width="298" height="108" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<circle cx="54" cy="86" r="11" fill="#57606a"/>
<text x="54" y="91" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="74" y="91" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Manuscript input</text>
<text x="44" y="116" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">pasted text · .bib · PDF upload</text>
<text x="44" y="135" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">→ references + citing sentences</text>
<rect x="364" y="62" width="298" height="108" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<circle cx="388" cy="86" r="11" fill="#57606a"/>
<text x="388" y="91" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="408" y="91" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Parse</text>
<text x="378" y="116" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">GROBID (PDF structure)</text>
<text x="378" y="135" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">+ LLM reference extraction;</text>
<text x="378" y="154" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">fields kept only if verbatim in input</text>
<rect x="698" y="62" width="298" height="108" rx="8" fill="#e7f0ff" stroke="#0b5cd5" stroke-width="2"/>
<circle cx="722" cy="86" r="11" fill="#0b5cd5"/>
<text x="722" y="91" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="742" y="91" font-size="16" font-weight="700" fill="#0b5cd5" text-anchor="start">Reference audit</text>
<text x="712" y="116" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">Crossref · OpenAlex · arXiv · Sem. Scholar</text>
<text x="712" y="135" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">deterministic match: title, authors,</text>
<text x="712" y="154" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">year ±1, DOI, negation rule</text>
<rect x="1032" y="62" width="298" height="108" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<circle cx="1056" cy="86" r="11" fill="#57606a"/>
<text x="1056" y="91" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1076" y="91" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Fetch source text</text>
<text x="1046" y="116" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">Europe PMC · arXiv · Unpaywall</text>
<text x="1046" y="135" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">full text, else abstract</text>
<text x="1046" y="154" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">(PDFs → GROBID)</text>
<rect x="30" y="208" width="298" height="108" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<circle cx="54" cy="232" r="11" fill="#57606a"/>
<text x="54" y="237" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="74" y="237" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Retrieve evidence</text>
<text x="44" y="262" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">BM25 → dense → cross-encoder</text>
<text x="44" y="281" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">top 6 excerpts per claim</text>
<rect x="364" y="208" width="298" height="108" rx="8" fill="#e7f0ff" stroke="#0b5cd5" stroke-width="2"/>
<circle cx="388" cy="232" r="11" fill="#0b5cd5"/>
<text x="388" y="237" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="408" y="237" font-size="16" font-weight="700" fill="#0b5cd5" text-anchor="start">Judge + skeptic</text>
<text x="378" y="262" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">two different LLM providers</text>
<text x="378" y="281" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">disagree ⇒ needs review +</text>
<text x="378" y="300" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">the more cautious verdict</text>
<rect x="698" y="208" width="298" height="108" rx="8" fill="#e7f0ff" stroke="#0b5cd5" stroke-width="2"/>
<circle cx="722" cy="232" r="11" fill="#0b5cd5"/>
<text x="722" y="237" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="742" y="237" font-size="16" font-weight="700" fill="#0b5cd5" text-anchor="start">Verbatim quote gate</text>
<text x="712" y="262" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">quote of ≥ 5 words found verbatim</text>
<text x="712" y="281" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">in the source, else</text>
<text x="712" y="300" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">insufficient_evidence</text>
<rect x="1032" y="208" width="298" height="108" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<circle cx="1056" cy="232" r="11" fill="#57606a"/>
<text x="1056" y="237" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="1076" y="237" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Report</text>
<text x="1046" y="262" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">streamed live as checks finish</text>
<text x="1046" y="281" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">shareable link · export JSON / MD</text>
<polyline points="330,116.0 360,116.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="330,262.0 360,262.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="664,116.0 694,116.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="664,262.0 694,262.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="998,116.0 1028,116.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="998,262.0 1028,262.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="1181.0,172 1181.0,189.0 179.0,189.0 179.0,204" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<rect x="30" y="336" width="632" height="50" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="44" y="357" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Failure is never a negative finding</text>
<text x="44" y="376" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">provider down / timeout / 429 / parse error ⇒ unchecked or insufficient evidence</text>
<rect x="698" y="336" width="632" height="50" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="712" y="357" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Untrusted text is wrapped</text>
<text x="712" y="376" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">manuscript and source text reach the LLM only via wrap_untrusted()</text>
<text x="30" y="410" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Deployment</text>
<rect x="30" y="482" width="140" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="44" y="511" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Browser</text>
<text x="44" y="536" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">upload · read report</text>
<rect x="200" y="420" width="820" height="260" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="216" y="446" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">Vultr Cloud Compute (4 vCPU / 16 GB, Ubuntu 24.04) · Docker Compose</text>
<rect x="224" y="484" width="190" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="238" y="513" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Caddy</text>
<text x="238" y="538" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">HTTPS · sslip.io domain</text>
<rect x="454" y="484" width="270" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="468" y="513" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">app</text>
<text x="468" y="538" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">FastAPI + pipeline</text>
<text x="468" y="557" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">3 concurrent jobs, others queue</text>
<rect x="764" y="484" width="232" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="778" y="513" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">GROBID container</text>
<text x="778" y="538" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">PDF → structured text</text>
<polyline points="172,524.0 220,524.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="416,524.0 450,524.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<polyline points="726,524.0 760,524.0" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<rect x="454" y="586" width="226" height="78" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="468" y="608" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">app_cache volume</text>
<text x="468" y="627" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">reports · caches · daily counters</text>
<polyline points="514,566 514,582" fill="none" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
<rect x="1070" y="420" width="260" height="90" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="1084" y="449" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Scholarly APIs</text>
<text x="1084" y="474" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">Crossref, OpenAlex, arXiv, S2,</text>
<text x="1084" y="493" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">Europe PMC, Unpaywall</text>
<rect x="1070" y="590" width="260" height="90" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="1084" y="619" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">LLM providers</text>
<text x="1084" y="644" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">judge and skeptic on</text>
<text x="1084" y="663" font-size="13" font-weight="400" fill="#4b535d" text-anchor="start">different providers</text>
<polyline points="706,482 706,465.0 1066,465.0" fill="none" stroke="#57606a" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<polyline points="706,566 706,635.0 1066,635.0" fill="none" stroke="#57606a" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
