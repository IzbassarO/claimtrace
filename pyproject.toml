[project]
name = "claimtrace"
version = "0.1.0"
description = "Citation audit: are the references real, and do they say what the manuscript claims?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "bibtexparser>=1.4,<2",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimtrace"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# keep pytest temp dirs inside the repo (one-folder rule); pytest recreates it each run
addopts = "--basetemp=.pytest-tmp"
markers = ["live: hits real network/LLM APIs; runs only with RUN_LIVE=1"]
