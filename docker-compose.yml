# Fixed project name: volumes are always claimtrace-hg_app_cache etc., whatever the checkout dir.
name: claimtrace-hg

services:
  app:
    build: .
    env_file: .env
    environment:
      GROBID_URL: http://grobid:8070
      CACHE_DIR: /cache
    volumes:
      - app_cache:/cache
    depends_on:
      grobid:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped
    # measured peak on a 40-reference PDF: ~0.7 GB
    mem_limit: 1536m
    pids_limit: 256

  grobid:
    # CRF-only image: multi-arch (amd64 + arm64), ~2 GB RAM, no GPU needed.
    image: grobid/grobid:0.9.1-crf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # measured up to ~4.1 GB while parsing; cap it so it cannot starve the app
    mem_limit: 4608m
    pids_limit: 512

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # admin API answers on 127.0.0.1 only (busybox wget resolves localhost to ::1)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

volumes:
  app_cache:
  caddy_data:
  caddy_config:
